# Add these tiles to a Lovelace dashboard. Entity IDs may differ in your setup.
- type: tile
  entity: switch.entrance_intercom_buzzer_intercom_buzzer
  name: Intercom Buzzer
  icon: mdi:bell-ring
  features:
    - type: toggle

- type: tile
  entity: script.intercom_door_opener
  name: Door Opener
  icon: mdi:door-open
  tap_action:
    action: perform-action
    perform_action: script.turn_on
    target:
      entity_id: script.intercom_door_opener

# The Oref integration supplies this custom map card. It renders active alerts,
# pre-alerts, recent clears, and the home area.
- type: custom:oref-alert-map
  title: Oref Alert · Home
  auto_fit: false
  show_home: true
  hebrew_basemap: true
  show_pre_alert: true
  show_end: true
  show_location: true
  aspect_ratio: 50%
